name: File permission calibration
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  calibration:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.171.0", "0.172.0-alpha.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Install pinned CLI
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: npm install --prefix "$RUNNER_TEMP/codex" "@openai/codex@$CODEX_VERSION"
      - name: Run fixture controls and record all outcomes
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: |
          export PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH"
          python scripts/run_calibration.py --runner codex-sandbox --expect-version "codex-cli $CODEX_VERSION" --out "$RUNNER_TEMP/observations.json"
          python scripts/score_calibration.py "$RUNNER_TEMP/observations.json" > "$RUNNER_TEMP/scores.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-calibration-${{ matrix.codex }}
          path: |
            ${{ runner.temp }}/observations.json
            ${{ runner.temp }}/scores.json
      - name: Verify that the real CLI exercised the controls
        run: |
          python - "$RUNNER_TEMP/observations.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          expected = {"allowed": 1, "denied": 0, "denied_repeat": 0, "missing": 2}
          for sample in data["samples"]:
              assert sample["runner_status"] == "completed", sample["case"]
              assert sample["observer_control"] == "protected", sample["case"]
              assert sample["exit_code"] == expected[sample["case"]], sample["case"]
          PY
