name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Smoke demo
        run: agent-boundary demo --json /tmp/agent-boundary-demo.json

  portability:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: agent-boundary demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine pytest
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          agent-boundary --version
          agent-boundary demo --json agent-boundary-wheel-smoke.json
          test -s agent-boundary-wheel-smoke.json
          python - <<'PY'
          from importlib.metadata import version

          assert version("agent-boundary-check") == "0.1.2"
          PY
      - name: Test installed wheel using the source distribution
        shell: bash
        run: |
          set -euo pipefail
          testdir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$testdir"
          cd "$testdir"/*
          python - <<'PY'
          from pathlib import Path
          import agent_boundary_check

          assert not Path(agent_boundary_check.__file__).resolve().is_relative_to(Path.cwd())
          assert Path("tests/conftest.py").is_file()
          PY
          python -m pytest -q
