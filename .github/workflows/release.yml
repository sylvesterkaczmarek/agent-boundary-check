name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - ".release-version"

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify release version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          RELEASE_VERSION="$(tr -d '[:space:]' < .release-version)"
          test "${RELEASE_VERSION}" = "${PACKAGE_VERSION}" || {
            echo ".release-version (${RELEASE_VERSION}) does not match package version (${PACKAGE_VERSION})"
            exit 1
          }
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-boundary-check
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify public PyPI install (Python ${{ matrix.python-version }})
    needs: [build, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install released package from public PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple "agent-boundary-check==${VERSION}"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "agent-boundary-check ${VERSION} was not installable from public PyPI." >&2
              exit 1
            fi
            sleep 10
          done
          python -m pip check

      - name: Smoke test released package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          agent-boundary --version
          agent-boundary demo --json agent-boundary-pypi-smoke.json
          test -s agent-boundary-pypi-smoke.json
          python - <<'PY'
          import os
          from importlib.metadata import version

          assert version("agent-boundary-check") == os.environ["VERSION"]
          PY

  tag:
    name: Tag published version
    needs: [build, publish, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
